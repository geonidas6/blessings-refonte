services:
  cleaning:
    build:
      context: .
      args:
        SITE: cleaning
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blessing_refonte.rule=Host(`blessing.it-sefako.com`)"
      - "traefik.http.routers.blessing_refonte.entrypoints=websecure"
      - "traefik.http.routers.blessing_refonte.tls.certresolver=myresolver"
      - "traefik.http.services.blessing_refonte.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy_net"
    networks:
      - proxy_net
  couture:
    build:
      context: .
      args:
        SITE: couture
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.couture_refonte.rule=Host(`couture.it-sefako.com`)"
      - "traefik.http.routers.couture_refonte.entrypoints=websecure"
      - "traefik.http.routers.couture_refonte.tls.certresolver=myresolver"
      - "traefik.http.services.couture_refonte.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy_net"
    networks:
      - proxy_net
networks:
  proxy_net:
    external: true
